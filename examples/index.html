<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Демо форми заявки · leadgram</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #ffffff;
      --text: #1d1b19;
      --muted: #6b655e;
      --line: #ddd6cc;
      --accent: #2f6f4f;
      --accent-ink: #ffffff;
      --danger: #b3261e;
      --radius: 14px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161513; --card: #201f1c; --text: #f1ede7; --muted: #a59e94; --line: #3a3732; --accent: #6fbf8f; --accent-ink: #10231a; --danger: #ff8a80; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { width: min(100%, 440px); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px; }
    .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.2; }
    .lead { margin: 0 0 24px; color: var(--muted); }
    .field { display: grid; gap: 6px; margin-bottom: 16px; }
    label, legend { font-size: 14px; font-weight: 600; }
    .hint { font-weight: 400; color: var(--muted); }
    input, select, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: transparent; color: inherit; font: inherit; }
    textarea { min-height: 96px; resize: vertical; }
    input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    [aria-invalid="true"] { border-color: var(--danger); }
    fieldset { border: 0; padding: 0; margin: 0 0 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chips label { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; font-weight: 500; cursor: pointer; }
    .chips input { width: auto; margin: 0; accent-color: var(--accent); }
    button { width: 100%; padding: 14px; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: progress; }
    [data-leadgram-status] { min-height: 24px; margin: 12px 0 0; font-size: 14px; }
    form[data-leadgram-state="success"] [data-leadgram-status] { color: var(--accent); }
    form[data-leadgram-state="error"] [data-leadgram-status] { color: var(--danger); }
    .note { margin: 20px 0 0; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Coffee Point · кейтеринг</p>
    <h1>Кава на ваш захід</h1>
    <p class="lead">Залиште контакти, і бариста передзвонить протягом 15 хвилин, щоб узгодити меню.</p>

    <form data-leadgram="/lead" action="/lead" method="post" novalidate>
      <input type="hidden" name="_form" value="Кава на захід">

      <div class="field">
        <label for="name">Ім’я</label>
        <input id="name" name="name" autocomplete="name">
      </div>

      <div class="field">
        <label for="phone">Телефон</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="067 123 45 67">
      </div>

      <div class="field">
        <label for="guests">Кількість гостей</label>
        <select id="guests" name="guests">
          <option>до 20</option>
          <option>20–50</option>
          <option>50–100</option>
          <option>понад 100</option>
        </select>
      </div>

      <fieldset>
        <legend>Що потрібно <span class="hint">(можна кілька)</span></legend>
        <div class="chips">
          <label><input type="checkbox" name="extras" value="Кава-бар"> Кава-бар</label>
          <label><input type="checkbox" name="extras" value="Випічка"> Випічка</label>
          <label><input type="checkbox" name="extras" value="Чай"> Чай</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="message">Коментар <span class="hint">(необов’язково)</span></label>
        <textarea id="message" name="message" placeholder="Дата, адреса, побажання"></textarea>
      </div>

      <button type="submit">Замовити дзвінок</button>
      <p data-leadgram-status></p>
    </form>

    <p class="note">Це демо leadgram. Заявка прийде в Telegram-чат із TELEGRAM_CHAT_IDS.</p>
  </main>

  <script src="/leadgram.js" defer></script>
</body>
</html>
